<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudang Taehwa - SJ Resmi</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--biru:#2563eb; --hijau:#16a34a; --kuning:#f59e0b; --abu:#f1f5f9;}
*{box-sizing:border-box;font-family:'Segoe UI'} body{background:var(--abu);margin:0;padding:0}
.header{background:linear-gradient(135deg,var(--biru),#1e40af);color:white;padding:20px;text-align:center}
.container{display:grid;grid-template-columns:1fr;gap:15px;padding:15px}
@media(min-width:900px){.container{grid-template-columns:1fr 1fr}}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card h3{color:var(--biru);border-bottom:2px solid var(--abu);padding-bottom:8px;margin-bottom:15px}
.input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
.btn{padding:12px;border:none;border-radius:8px;font-weight:700;color:white;cursor:pointer;width:100%;margin-top:8px}
.btn-biru{background:var(--biru)}.btn-hijau{background:var(--hijau)}.btn-kuning{background:var(--kuning);color:#000}
.tabel{width:100%;font-size:13px;border-collapse:collapse;margin-top:10px}
.tabel td,.tabel th{border:1px solid #eee;padding:8px;text-align:left}
#reader{width:100%;margin:10px 0;border-radius:8px;overflow:hidden}
.notif{padding:10px;border-radius:8px;margin-top:10px;display:none;background:#dcfce7;color:#166534}
.menu{display:flex;gap:10px;padding:10px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="header">
  <h1>📦 APLIKASI GUDANG TAEHWA</h1>
  <p>Format Surat Jalan Resmi</p>
</div>

<div class="menu">
  <button onclick="showTab('input')" class="btn btn-biru" style="width:auto">Input Data</button>
  <button onclick="showTab('cari')" class="btn btn-biru" style="width:auto">Cari SJ</button>
  <button onclick="exportExcel()" class="btn btn-hijau" style="width:auto">Export Excel</button>
</div>

<!-- TAB INPUT -->
<div id="tab-input" class="container">
  <!-- BARANG MASUK -->
  <div class="card">
    <h3>📥 BARANG MASUK</h3>
    <input id="m_tgl" type="date" class="input">
    <input id="m_no" class="input" placeholder="No Bukti: BM-001">
    <select id="m_barang" class="input"><option>Loading...</option></select>
    <input id="m_qty" type="number" class="input" placeholder="Qty Masuk">
    <input id="m_sup" class="input" placeholder="Supplier">
    <button class="btn btn-hijau" onclick="simpan('masuk')">Simpan Barang Masuk</button>
    <div id="notifM" class="notif">Data berhasil disimpan & Stok Bertambah!</div>
  </div>

  <!-- SURAT JALAN -->
  <div class="card">
    <h3>🚚 SURAT JALAN</h3>
    <input id="k_tgl" type="date" class="input">
    <input id="k_no" class="input" readonly placeholder="Auto No SJ">
    <input id="k_buyer" class="input" placeholder="Buyer">
    <input id="k_po" class="input" placeholder="P/O #">
    <input id="k_tujuan" class="input" placeholder="Alamat Tujuan">
    <input id="k_driver" class="input" placeholder="No Kendaraan / Driver">
    <input id="k_kepada" class="input" placeholder="Kepada">
    <input id="k_namaOrder" class="input" placeholder="Nama Order">
    <button class="btn btn-kuning" onclick="startScanner()">📷 Scan Barcode Barang</button>
    <div id="reader" style="display:none"></div>
    <select id="k_barang" class="input"><option>Loading...</option></select>
    <input id="k_style" class="input" placeholder="Style">
    <input id="k_ukuran" class="input" placeholder="Ukuran">
    <input id="k_qty" type="number" class="input" placeholder="Qty Keluar">
    <input id="k_foto" type="file" accept="image/*" capture="camera" class="input">
    <button class="btn btn-kuning" onclick="tambahBarang()">+ Tambah ke Daftar</button>
    <table class="tabel" id="tabelBarangSJ"><thead><tr><th>Style</th><th>Nama</th><th>Ukuran</th><th>Qty</th><th>Hapus</th></tr></thead><tbody></tbody></table>
    <button class="btn btn-biru" onclick="simpan('keluar')">Simpan & Cetak SJ</button>
    <div id="notifK" class="notif">Data berhasil disimpan & Stok Berkurang!</div>
  </div>
</div>

<!-- TAB CARI -->
<div id="tab-cari" class="card" style="display:none;margin:15px">
  <h3>🔍 CARI SURAT JALAN</h3>
  <input id="keyword" class="input" placeholder="Ketik No SJ atau Nama Buyer">
  <button class="btn btn-biru" onclick="cariData()">Cari</button>
  <div id="hasilCari" style="overflow-x:auto;margin-top:10px"></div>
</div>

<!-- TABEL STOK -->
<div class="card" style="margin:15px">
  <h3>📊 STOK SAAT INI</h3>
  <div style="overflow-x:auto">
    <table class="tabel" id="tabelStok"><thead><tr><th>Kode</th><th>Nama Barang</th><th>Satuan</th><th>Stok</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
const URL_SCRIPT = "PASTE_URL_APPS_SCRIPT_DISINI";
let dataBarang = []; let listBarangSJ = []; let base64Foto = ''; let html5QrCode;

// INIT
m_tgl.valueAsDate = new Date(); k_tgl.valueAsDate = new Date();
loadDataBarang(); getNoSJ();

function showTab(tab){
  tab-input.style.display='none'; tab-cari.style.display='none';
  document.getElementById('tab-'+tab).style.display='grid';
}

function loadDataBarang(){
  google.script.run.withSuccessHandler(data=>{
    dataBarang = data;
    let opt='<option value="">-- Pilih Barang --</option>';
    let tr='';
    data.forEach(r=>{
      if(r[0]) {
        opt += `<option value="${r[0]}|${r[1]}">${r[0]} - ${r[1]} | Stok: ${r[3]}</option>`;
        tr += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}</b></td></tr>`;
      }
    });
    m_barang.innerHTML=opt; k_barang.innerHTML=opt;
    tabelStok.querySelector('tbody').innerHTML=tr;
  }).getDataBarang();
}

function getNoSJ(){ google.script.run.withSuccessHandler(n=>k_no.value=n).getLastSJ(); }

function startScanner(){
  reader.style.display='block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({facingMode:"environment"},{fps:10},msg=>{
    k_barang.value=msg;
    html5QrCode.stop(); reader.style.display='none';
  });
}

k_foto.onchange=e=>{const f=e.target.files[0]; if(f){const r=new FileReader(); r.onload=()=>base64Foto=r.result.split(',')[1]; r.readAsDataURL(f);}}

function tambahBarang(){
  if(!k_barang.value ||!k_qty.value){alert("Pilih barang dan isi qty dulu"); return;}
  let b=k_barang.value.split('|');
  listBarangSJ.push({kode:b[0],nama:b[1],style:k_style.value,ukuran:k_ukuran.value,qty:k_qty.value});
  renderTabelSJ(); k_style.value=''; k_ukuran.value=''; k_qty.value='';
}
function renderTabelSJ(){
  tabelBarangSJ.querySelector('tbody').innerHTML=listBarangSJ.map((b,i)=>`<tr><td>${b.style}</td><td>${b.nama}</td><td>${b.ukuran}</td><td>${b.qty}</td><td><button onclick="listBarangSJ.splice(${i},1);renderTabelSJ()">Hapus</button></td></tr>`).join('');
}

function simpan(tipe){
  let data={tipe:tipe};
  let notif = tipe=='masuk'? notifM : notifK;
  if(tipe=="masuk"){
    let b=m_barang.value.split('|');
    if(!b[0]){alert("Pilih barang dulu"); return;}
    data={...data,tanggal:m_tgl.value,noBukti:m_no.value,kode:b[0],nama:b[1],qty:m_qty.value,supplier:m_sup.value}
  } else {
    if(listBarangSJ.length==0){alert("Tambah barang dulu"); return;}
    data={...data,idSJ:'ID'+Date.now(),tanggal:k_tgl.value,noSJ:k_no.value,buyer:k_buyer.value,po:k_po.value,tujuan:k_tujuan.value,driver:k_driver.value,kepada:k_kepada.value,namaOrder:k_namaOrder.value,barang:listBarangSJ,foto:base64Foto}
    cetakSJ(d);
  }
  fetch(URL_SCRIPT,{method:"POST",body:JSON.stringify(data)})
.then(res=>res.json())
.then(()=>{notif.style.display='block'; setTimeout(()=>{notif.style.display='none'; location.reload()},2000)})
}

// FUNGSI CETAK FORMAT RESMI TAEHWA
function cetakSJ(d){
  let rows = '';
  let totalQty = 0;
  d.barang.forEach(b=>{
    totalQty += Number(b.qty);
    rows += `<tr>
      <td>${b.style}</td>
      <td></td>
      <td style="text-align:left">${b.nama}</td>
      <td>${b.ukuran}</td>
      <td></td>
      <td style="text-align:center">${b.qty}</td>
    </tr>`;
  });

  let win=window.open('');
  win.document.write(`
  <html>
  <head>
    <title>Surat Jalan ${d.noSJ}</title>
    <style>
      body{font-family:Arial, sans-serif; font-size:11px; margin:20px;}
     .kop{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #000; padding-bottom:5px}
     .kop-kiri{line-height:1.4}
     .kop-kanan{text-align:right; line-height:1.4; font-size:24px; font-weight:bold}
     .judul{text-align:center; font-size:18px; font-weight:bold; text-decoration:underline; margin:10px 0}
     .info-atas{display:flex; justify-content:space-between; margin-bottom:10px}
     .tabel-sj{width:100%; border-collapse:collapse; border:1px solid #000}
     .tabel-sj th,.tabel-sj td{border:1px solid #000; padding:4px; text-align:center}
     .tabel-sj th{background:#f0f0f0; font-weight:bold}
     .ttd{width:100%; margin-top:20px; border-collapse:collapse}
     .ttd td{border:1px solid #000; height:70px; vertical-align:top; padding:5px; width:25%}
     .catatan{font-size:9px; margin-top:5px}
    </style>
  </head>
  <body onload="window.print()">

    <div class="kop">
      <div class="kop-kiri">
        <div style="font-size:16px; font-weight:bold">PT. TAEHWA INTERNATIONAL</div>
        <div>(CARTON BOX, POLY BAG)</div>
        <div>Jl. Raya Narogong Km 9, Nurul Huda No.7</div>
        <div>Bantar Gebang - Bekasi 17310</div>
        <div>Telp. (021) 8265 0675, 8250 185, 8250 186</div>
        <div>Fax. (021) 83803905</div>
      </div>
      <div class="kop-kanan">T<br><b>SJ. No. : ${d.noSJ}</b></div>
    </div>

    <div class="judul">SURAT JALAN</div>

    <div class="info-atas">
      <div>
        <table>
          <tr><td>NO. SURAT JALAN :</td><td><b>${d.noSJ}</b></td></tr>
          <tr><td>BUYER</td><td>: ${d.buyer}</td></tr>
          <tr><td>P/O #</td><td>: ${d.po}</td></tr>
        </table>
      </div>
      <div>
        <table>
          <tr><td>TANGGAL</td><td>: ${d.tanggal}</td></tr>
          <tr><td>KEPADA</td><td>: ${d.kepada}</td></tr>
          <tr><td>ALAMAT</td><td>: ${d.tujuan}</td></tr>
          <tr><td>NO KENDARAAN</td><td>: ${d.driver}</td></tr>
          <tr><td>NAMA ORDER</td><td>: ${d.namaOrder}</td></tr>
        </table>
      </div>
    </div>

    <table class="tabel-sj">
      <thead>
        <tr>
          <th style="width:10%">STYLE</th>
          <th style="width:20%">NAMA BARANG</th>
          <th style="width:30%">NAMA BARANG</th>
          <th style="width:10%">UKURAN</th>
          <th style="width:10%"></th>
          <th style="width:10%">JUMLAH</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr>
          <td colspan="5" style="text-align:right; font-weight:bold">TOTAL</td>
          <td style="font-weight:bold">${totalQty}</td>
        </tr>
      </tbody>
    </table>

    <table class="ttd">
      <tr>
        <td>DITERIMA<br><br><br>Nama Jelas:.................</td>
        <td>PENGIRIM<br><br><br>Nama Jelas:.................</td>
        <td>DISETUJUI<br><br><br>Nama Jelas:.................</td>
        <td rowspan="2" style="text-align:center; vertical-align:middle">[STEMPEL]</td>
      </tr>
      <tr>
        <td colspan="3" class="catatan">
          (1) PUTIH: Pelengkap tagihan (2) HIJAU: Dikembalikan (3) KUNING,PINK,BIRU: Customer
        </td>
      </tr>
    </table>

  </body></html>`);
}
function cariData(){
  google.script.run.withSuccessHandler(d=>{
    let tr=d.map(r=>`<tr><td>${r[2]}</td><td>${r[1]}</td><td>${r[3]}</td><td>${r[6]}</td></tr>`).join('');
    hasilCari.innerHTML=`<table class="tabel"><tr><th>No SJ</th><th>Tgl</th><th>Buyer</th><th>Barang</th></tr>${tr}</table>`
  }).cariSJ(keyword.value)
}
function exportExcel(){ window.open(URL_SCRIPT+'?action=export') }
</script>
</body>
</html>
